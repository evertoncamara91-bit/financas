<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230F766E'/%3E%3Ctext x='90' y='122' font-size='100' text-anchor='middle'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<title>Finanças da Casa</title>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#0F172A;--ink2:#475569;--mute:#94A3B8;--line:#EBEEF2;--pri:#0F766E;--pril:#E6F6F3;--red:#E5484D;--redl:#FDECEC;--amb:#B45309;--ambl:#FEF3C7;--page:#E5E8EC}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.dev{position:relative;width:100%;height:100dvh;background:var(--bg);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
@media(min-width:520px){body{display:grid;place-items:center;min-height:100vh;padding:24px}.dev{width:390px;height:844px;border-radius:48px;border:10px solid #0B0B0C;box-shadow:0 30px 60px rgba(15,23,42,.25)}}
.view{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 120px;-webkit-overflow-scrolling:touch}
.hd{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px;gap:8px}
.hi small{display:block;color:var(--mute);font-size:12.5px}
.hi b{font-size:22px;letter-spacing:-.03em}
.month{display:flex;align-items:center;background:var(--card);border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);white-space:nowrap}
.month button{padding:9px 12px;font-size:16px;color:var(--ink2)}
.hero{border-radius:28px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#2DD4BF 0%,#0F766E 45%,#0B4F4A 100%);box-shadow:0 12px 24px rgba(15,118,110,.25)}
.hero.neg{background:radial-gradient(120% 140% at 100% 0%,#FB7185 0%,#BE123C 50%,#881337 100%);box-shadow:0 12px 24px rgba(190,18,60,.25)}
.hero small{opacity:.85;font-size:13px}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.04em;margin:0 0 12px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.hero .note{font-size:12.5px;opacity:.92;margin-top:7px}
.io{display:flex;gap:10px;margin-top:14px}
.io div{flex:1;background:rgba(255,255,255,.15);border-radius:16px;padding:9px 12px;font-size:12px}
.io b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px}
.sec b{font-size:17px;letter-spacing:-.02em}
.sec button{font-size:13.5px;color:var(--pri);font-weight:600;padding:6px 0}
.cards{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.cc{flex:none;width:150px;border-radius:22px;padding:14px;color:#fff;font-size:12px;text-align:left;scroll-snap-align:start}
.cc b{display:block;font-size:18px;margin:18px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc span{opacity:.85}
.card{background:var(--card);border-radius:22px;padding:4px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.it+.it{border-top:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--mute);font-size:12.5px}
.val{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.pos{color:var(--pri)}
.bar{height:6px;border-radius:9px;background:#EEF1F4;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.empty{text-align:center;color:var(--mute);padding:22px 8px;font-size:14px}
.tab{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 24px rgba(15,23,42,.12);font-size:11px;color:var(--mute);font-weight:600;z-index:5}
.tab button{text-align:center;width:58px;padding:6px 0}
.tab span{display:block;font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.5}
.tab .on{color:var(--pri)}.tab .on span{filter:none;opacity:1}
.tab .add{width:56px;height:56px;border-radius:19px;background:var(--pri);color:#fff;font-size:32px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,118,110,.4);margin-top:-8px}
.dim{position:absolute;inset:0;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:30px 30px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:9;max-height:92%;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#D9DEE4;margin:0 auto 12px}
.seg{display:flex;background:#F1F3F5;border-radius:14px;padding:3px}
.seg button{flex:1;text-align:center;padding:9px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amt{text-align:center;font-size:44px;font-weight:700;letter-spacing:-.04em;margin:14px 0 2px;font-variant-numeric:tabular-nums}
.amt small{font-size:18px;color:var(--mute);font-weight:500;margin-right:4px}
.amt.zero{color:#CBD2DA}
.desc{display:block;width:100%;text-align:center;color:var(--ink2);font-size:14px;margin-bottom:12px;outline:0;padding:4px}
.desc::placeholder{color:var(--mute)}
.cats{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:60px;text-align:center;font-size:11px;color:var(--ink2)}
.cat .ic{margin:0 auto 5px;width:48px;height:48px;border-radius:16px;font-size:22px;transition:transform .15s}
.cat.on .ic{outline:2.5px solid var(--pri);outline-offset:2px;transform:scale(1.04)}
.cat.on{color:var(--ink);font-weight:700}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;padding:8px 13px;border-radius:99px;background:#F1F3F5;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{background:#F6F7F9;border-radius:15px;padding:12px 0;font-size:21px;font-weight:500;transition:background .1s}
.keys button:active{background:#E3E7EB}
.save{display:block;width:100%;margin-top:10px;background:var(--pri);color:#fff;text-align:center;border-radius:17px;padding:15px;font-weight:700;font-size:16px}
.save:disabled{opacity:.4}
.ghost{display:block;width:100%;margin-top:8px;text-align:center;padding:12px;color:var(--red);font-weight:600}
.search{display:block;width:100%;background:var(--card);border-radius:14px;padding:11px 14px;font-size:15px;margin-bottom:10px;outline:0}
.day{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 6px 7px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #CBD2DA;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;transition:all .15s}
.check.on{background:var(--pri);border-color:var(--pri)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:4px}
.pill.r{background:var(--redl);color:var(--red)}.pill.g{background:var(--pril);color:var(--pri)}
.prog{background:var(--card);border-radius:22px;padding:15px;margin-bottom:12px}
.prog .t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:22px;padding:15px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .ic{width:44px;height:44px}
.tile b{font-size:15px;display:block}.tile small{color:var(--mute);font-size:12.5px}
.dl{display:flex;justify-content:space-between;padding:11px 0;font-size:14.5px}
.dl+.dl{border-top:1px solid var(--line)}
.dl span{color:var(--mute)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:20;transition:transform .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translate(-50%,0)}
.badge{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 8px);font-size:10.5px;font-weight:700;background:var(--ambl);color:var(--amb);padding:3px 9px;border-radius:99px;z-index:4}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info{background:#F6F7F9;border-radius:16px;padding:4px 12px;margin-bottom:12px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.irow+.irow{border-top:1px solid var(--line)}
.irow small{display:block;color:var(--mute);font-size:12px}
.sel{background:#fff;border-radius:10px;padding:7px 10px;font-weight:600;font-size:13.5px;border:1px solid var(--line);-webkit-appearance:none;appearance:none}
.step{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px}
.step button{width:34px;height:34px;font-size:18px;color:var(--pri);font-weight:700}
.step b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.blk{background:var(--card);border-radius:22px;padding:14px 14px 4px;margin-bottom:12px}
.blkh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.blkh b{font-size:15.5px}
.blkh small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.blkf{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;padding:10px 0 12px;border-top:1px solid var(--line);margin-top:2px}
.sub{padding:0 0 8px 52px}
.sub div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);padding:4px 0}
.sub div span:last-child{font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--ambl);color:var(--amb);margin-left:4px}
@media(min-width:520px){body{display:block;padding:0;background:var(--bg)}.dev{width:100%;max-width:480px;height:100dvh;margin:0 auto;border-radius:0;border:0;box-shadow:0 0 0 1px var(--line)}}
#toast button{color:#5EEAD4;font-weight:700;margin-left:8px}
.dot{width:10px;height:10px;border-radius:99px;display:inline-block}.dot.g{background:#10B981}.dot.r{background:var(--red)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#E2E8F0;margin-bottom:10px}.stack i{display:block;height:100%}
.lg{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink2)}.lg b{color:var(--ink);font-variant-numeric:tabular-nums}.lg span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.warn{background:var(--ambl);color:var(--amb);font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;margin-top:10px}
.hint{color:var(--mute);font-size:12.5px;margin:8px 4px;line-height:1.45}
.mini{display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:8px}.mini div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.mini i{display:block;width:100%;background:#6366F1;border-radius:6px 6px 2px 2px;min-height:2px;opacity:.8}.mini small{font-size:10.5px;color:var(--mute);margin-top:4px}
.auth{max-width:380px;margin:0 auto;padding:40px 4px;text-align:center}.auth .logo{font-size:52px;margin-bottom:8px}.auth h1{font-size:26px;letter-spacing:-.03em;margin-bottom:6px}.auth .lead{color:var(--ink2);margin-bottom:18px}.auth .card{text-align:left}
.lead{color:var(--ink2);font-size:14px}
.fld{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;font-size:16px;color:var(--ink);outline:none}.fld:focus{border-color:var(--pri)}
.msg{background:var(--pril);color:var(--pri);font-size:14px;font-weight:600;padding:12px;border-radius:14px;margin-bottom:12px;text-align:left}
.link{display:block;margin:14px auto 0;color:var(--pri);font-weight:600;font-size:14px;padding:6px}
.spin{animation:sp 1.2s ease-in-out infinite}@keyframes sp{50%{transform:scale(.85);opacity:.6}}
.fin{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;text-align:right;min-width:0;width:55%;max-width:200px;color:var(--ink);outline:none}
.irow>span{flex:1}
.tog{width:46px;height:28px;border-radius:99px;background:#CBD5E1;position:relative;flex:none;transition:.2s}.tog:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.tog.on{background:var(--pri)}.tog.on:after{left:21px}
.save:disabled{opacity:.4}
button.mid{display:block;min-width:0}
.tiles{display:grid;gap:10px}
html,body,button,input,select,label,.view,.sheet{touch-action:manipulation}
input,select,textarea,.desc,.search,.sel,.fin,.fld{font-size:16px!important}
.sheet .grab{width:48px;height:5px;margin:0 auto 14px;position:relative}
.sheet .grab:before{content:'';position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sheet.drag{transition:none}
.frm .seg button{padding:7px}
.frm .fq{margin:8px 0 0}
.frm .amt{font-size:38px;margin:8px 0 0;line-height:1.15}
.frm .desc{margin-bottom:6px;padding:3px}
.frm .cats{margin-bottom:8px;gap:8px}
.frm .cat{width:54px;font-size:10.5px}
.frm .cat .ic{width:42px;height:42px;border-radius:14px;font-size:20px;margin-bottom:3px}
.frm .chips{margin-bottom:8px}
.frm .chip{padding:7px 12px}
.opts{display:flex;gap:6px;align-items:center}
.pill2{position:relative;display:flex;align-items:center;gap:2px;background:#F1F3F5;border-radius:12px;padding:0 10px;height:36px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.pill2 input[type=date]{position:absolute;inset:0;opacity:0;width:100%}
.pill2 select{border:0;background:none;font:inherit;font-size:13px!important;font-weight:700;color:var(--ink);-webkit-appearance:none;appearance:none;padding:0;outline:0}
.opts .step{margin-left:auto;height:36px;background:#F1F3F5;border:0}
.opts .step button{width:32px;height:36px}
.optx{font-size:11.5px;color:var(--mute);margin:5px 2px 8px;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frm .keys{gap:6px}
.frm .keys button{padding:9px 0;font-size:20px;border-radius:13px}
.frm .save{margin-top:8px;padding:13px}
.sheet{max-height:94%}
.rv{text-align:right;flex:none}.rv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.rv small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{background:var(--card);border-radius:16px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--ink2);text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.sheet .acts button{background:#F6F7F9;box-shadow:none}
.acts span{display:block;font-size:20px;margin-bottom:2px}
.hd .chip{flex:none}
.sec button{color:var(--pri);font-weight:600;font-size:13.5px}
@media(max-height:700px){.frm .amt{font-size:32px;margin-top:4px}.frm .cat .ic{width:36px;height:36px;font-size:17px}.frm .keys button{padding:7px 0;font-size:19px}.frm .save{padding:11px}.sheet{max-height:97%}}
@media(max-height:600px){.frm .fq{display:none}.frm .cat{font-size:0}.frm .cat .ic{margin-bottom:0}.frm .keys button{padding:6px 0}.sheet{max-height:99%}}
</style>
</head>
<body>
<div class="dev" id="dev">
  <div class="view" id="view"></div>
  <nav class="tab" id="nav" style="display:none">
    <button data-tab="home" class="on"><span>🏠</span>Início</button>
    <button data-tab="ext"><span>🧾</span>Extrato</button>
    <button class="add" data-act="add" aria-label="Novo lançamento">+</button>
    <button data-tab="contas"><span>📅</span>Contas</button>
    <button data-tab="mais"><span>☰</span>Mais</button>
  </nav>
  <div class="dim" id="dim" data-act="close"></div>
  <div class="sheet" id="sheet"></div>
  <div id="toast"></div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none">

  PLANS().forEach(function(p){if(p.k==='rin'||!p.post||isCard(p.src)||!active(p,ym))return;o.push({kind:'plan',p:p,due:billDue(p,ym),blk:blockOfDay(p.day),tot:p.v,paid:paid(p,ym)})});
  return o.sort(function(a,b){return a.paid-b.paid||a.due.localeCompare(b.due)});
}
function isDebt(t){var p=t.pid&&DB.plan[t.pid];return !!(t.inst||(p&&(p.k==='parc'||p.k==='div'))||/\b\d+\/\d+$/.test(t.desc)||t.cat==='vestuario')}
function isFixed(t){var p=t.pid&&DB.plan[t.pid];return !!(p&&p.k==='rec')}
function summary(ym){
  var a=txM(ym),R=sum(a,'R'),D=sum(a,'D'),fx=0,dv=0;
  a.forEach(function(t){if(t.t!=='D')return;if(isDebt(t))dv+=t.v;else if(isFixed(t))fx+=t.v});
  var pend=0,pfx=0,pdv=0;
  PLANS().forEach(function(p){if(p.k==='rin'||!p.post||!active(p,ym)||paid(p,ym))return;pend+=p.v;if(p.k==='rec')pfx+=p.v;else pdv+=p.v});
  var recP=r2(PLANS().reduce(function(s,p){return p.k==='rin'&&active(p,ym)&&!paid(p,ym)?s+p.v:s},0));
  var inc=r2(R+recP),out=r2(D+pend),dia=r2(D-fx-dv);
  return{R:R,D:D,recP:recP,pend:r2(pend),inc:inc,out:out,free:r2(inc-out),fixos:r2(fx+pfx),dividas:r2(dv+pdv),dia:dia,sobra:r2(R-D)};
}

/* ---------- banco ---------- */
var CACHE_KEY='financas-nuvem-cache';
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({hh:HH,members:MEMBERS,db:DB}))}catch(e){}}
function loadCache(){try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.hh&&HH&&c.hh.id===HH.id){DB=c.db;['tx','plan','fat','cfg','mi','ac','am'].forEach(function(k){if(!DB[k])DB[k]={}});Object.keys(DB).forEach(function(k){Object.keys(DB[k]).forEach(function(i){var o=DB[k][i];if(o&&typeof o==='object'&&o.id==null)o.id=i})});MEMBERS=c.members||[];return true}}catch(e){}return false}
function put(coll,id,data){
  DB[coll][id]=data;saveCache();render();
  return sb.from('items').upsert({household_id:HH.id,coll:coll,id:id,data:data}).then(function(r){if(r.error){toast('Não salvou: '+(navigator.onLine?r.error.message:'sem internet'));console.error(r.error)}});
}
function putMany(rows){
  rows.forEach(function(r){DB[r.coll][r.id]=r.data});saveCache();render();
  var chunks=[];for(var i=0;i<rows.length;i+=300)chunks.push(rows.slice(i,i+300));
  return chunks.reduce(function(p,c){return p.then(function(){return sb.from('items').upsert(c.map(function(r){return{household_id:HH.id,coll:r.coll,id:r.id,data:r.data}})).then(function(x){if(x.error)throw x.error})})},Promise.resolve());
}
function del(coll,id){
  delete DB[coll][id];saveCache();render();
  return sb.from('items').delete().eq('household_id',HH.id).eq('coll',coll).eq('id',id).then(function(r){if(r.error)toast('Não apagou: '+r.error.message)});
}
function loadAll(){
  var all=[],from=0;
  function page(){return sb.from('items').select('coll,id,data').eq('household_id',HH.id).range(from,from+999).then(function(r){if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length===1000){from+=1000;return page()}})}
  return page().then(function(){var n={tx:{},plan:{},fat:{},cfg:{},mi:{},ac:{},am:{}};all.forEach(function(r){if(n[r.coll]){if(r.data&&typeof r.data==='object'&&r.data.id==null)r.data.id=r.id;n[r.coll][r.id]=r.data}});DB=n;READY=true;saveCache()});
}
var CH=null;
function subscribe(){
  if(CH)sb.removeChannel(CH);
  CH=sb.channel('casa-'+HH.id).on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'household_id=eq.'+HH.id},function(p){
    var r=p.new&&p.new.coll?p.new:p.old;if(!r||!DB[r.coll])return;
    if(p.eventType==='DELETE')delete DB[r.coll][r.id];else{if(p.new.data&&p.new.data.id==null)p.new.data.id=r.id;DB[r.coll][r.id]=p.new.data}
    saveCache();if(!document.getElementById('sheet').classList.contains('on'))render();
  }).subscribe();
}

function importSheet(){var o=oldLocal();openSheet('<b style="font-size:19px;display:block;margin:2px 4px 12px">Importar dados</b>'+(o?'<div class="info" style="padding:14px"><b>Encontrei o app antigo neste aparelho</b><p class="hint" style="margin:4px 0 10px">'+o.tx.length+' lançamentos e '+((o.plans||[]).length)+' contas fixas.</p><button class="save" style="margin:0" data-act="implocal">Trazer para a nuvem</button><button class="ghost" style="margin:8px 0 0" data-act="clrlocal">Apagar dados do app antigo deste aparelho</button></div>':'')+'<div class="info" style="padding:14px"><b>Arquivo de backup (.json)</b><p class="hint" style="margin:4px 0 10px">O arquivo exportado pelo app antigo em Ajustes › Backup.</p><button class="save" style="margin:0;background:var(--ink)" data-act="impfile">Escolher arquivo</button></div><p class="hint">Importar de novo não duplica: lançamentos com o mesmo código são substituídos.</p>')}

function importData(d){
    if(!d||!Array.isArray(d.tx)){toast('Arquivo inválido. Use o backup exportado pelo app antigo.');return}var rows=[];closeSheet();
    d.tx.forEach(function(t){var x={id:String(t.id),d:t.d,t:t.t,desc:t.desc,cat:t.cat,v:t.v,src:t.src||'',by:ME.id};if(t.pid)x.pid=t.pid;if(t.mm&&t.m&&t.m!==t.d.slice(0,7))x.m=t.m;if(t.od)x.od=t.od;rows.push({coll:'tx',id:String(t.id),data:x})});
    (d.plans||[]).forEach(function(p){var x={id:p.id,k:p.k==='rin'?'rin':p.k==='parc'?'parc':p.k==='div'?'div':'rec',name:p.name,v:p.v,cat:p.cat||'outros',day:p.day||1,src:p.src||'',nm:!!p.nm,n0:p.n0||1,tot:p.tot||0,ym0:p.ym0||cur,post:p.post!==false};rows.push({coll:'plan',id:String(p.id),data:x})});
    if(d.cfg){var c=JSON.parse(JSON.stringify(CFG()));if(d.cfg.srcs)c.srcs=d.cfg.srcs.slice();if(d.cfg.cats)c.cats=d.cfg.cats.slice();if(d.cfg.cards)Object.keys(d.cfg.cards).forEach(function(k){var o=d.cfg.cards[k];if(o.on)c.cards[k]=Object.assign({pts:0,prog:''},c.cards[k]||{},{close:o.close,due:o.due});else delete c.cards[k]});rows.push({coll:'cfg',id:'main',data:c})}
    ['Crédito Elo','Crédito Nubank','Crédito Gabi'].forEach(function(s){if(d.tx.some(function(t){return t.src===s&&t.d<'2026-10-28'}))rows.push({coll:'fat',id:s+'|2026-10',data:{src:s,ym:'2026-10',by:ME.id}})});
    loadingScreen('Enviando '+rows.length+' registros…');
    putMany(rows).then(function(){showApp();toast('✓ '+d.tx.length+' lançamentos importados')}).catch(function(e){showApp();toast('Erro ao importar: '+e.message)});
}

/* arrastar para baixo fecha o painel */
(function(){var sh=document.getElementById('sheet'),dm=document.getElementById('dim'),y0=0,t0=0,dy=0,on=false,ok=false;
  sh.addEventListener('touchstart',function(e){if(!sh.classList.contains('on'))return;ok=sh.scrollTop<=0||!!e.target.closest('.grab');on=false;dy=0;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});

  function end(){if(!on){ok=false;return}on=false;ok=false;sh.classList.remove('drag');var v=dy/Math.max(1,Date.now()-t0);
    sh.style.transform='';dm.style.opacity='';if(dy>Math.min(140,sh.offsetHeight*.25)||(dy>40&&v>.5))closeSheet()}

})();
